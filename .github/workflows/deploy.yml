# Tests on every push and pull request; deploys to AWS only when they pass on
# main. Deploying straight from a push with nothing run against it is how a
# broken parser reaches real statements, so the deploy job depends on the test
# job and CloudFormation is never reached if a test fails.
#
# Credentials are OIDC, not stored keys. GitHub mints a short-lived token per
# run and the role in infra/stacks/bsa_stack.py (bsa-github-deploy) trusts only
# this repository on refs/heads/main. There is no AWS secret in this repo's
# settings to leak or rotate -- which matters here, because the repo is public.
#
# The role is created BY this stack, so it has to exist before CI can use it:
# run one `cdk deploy` by hand after merging this, then CI is self-sustaining.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The frontend is a no-build single file: nothing ever parses it before
      # CloudFront serves it, so one stray brace ships a blank page. node
      # --check every inline <script> block so a syntax error fails the build
      # instead of the login screen. (tests/test_frontend_syntax.py runs the
      # same check under pytest; this step keeps the gate even if that test
      # is skipped for a missing node.)
      - name: Frontend syntax check
        run: |
          python - <<'EOF'
          import pathlib, re, subprocess, sys, tempfile

          html = pathlib.Path("frontend/index.html").read_text()
          blocks = [m.group(1) for m in re.finditer(
              r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
              if m.group(1).strip()]
          if not blocks:
              sys.exit("no inline <script> blocks found in frontend/index.html")
          for i, js in enumerate(blocks, start=1):
              with tempfile.NamedTemporaryFile(
                      "w", suffix=".js", delete=False) as f:
                  f.write(js)
              r = subprocess.run(["node", "--check", f.name],
                                 capture_output=True, text=True)
              if r.returncode:
                  sys.exit(f"inline <script> block {i} fails node --check:\n"
                           f"{r.stderr}")
          print(f"{len(blocks)} inline script block(s) parse cleanly")
          EOF

      - name: Install test dependencies
        run: pip install --retries 10 --timeout 60 -r requirements-dev.txt

      - name: Run tests
        run: pytest

      # The layout descriptors are read at runtime from S3 as well as from the
      # bundle, so a malformed one is skipped with a log line nobody sees and
      # that bank silently stops working. Fail the build instead.
      - name: Validate every bundled layout descriptor
        run: |
          for f in backend/processor/bsa/layouts/*.yaml; do
            python scripts/manage_layouts.py validate "$f"
          done

      # cdk synth accepts a template CloudFormation will refuse: a dependency
      # cycle is only rejected when the changeset is created, minutes into a
      # deploy. This synths without Docker (CDK_SKIP_BUNDLING) and walks the
      # Ref/GetAtt/DependsOn graph itself. It caught a real one: the sweeper
      # as the processor's on-failure destination. (node was set up above,
      # for the frontend syntax check.)
      - name: Check the template for dependency cycles
        working-directory: infra
        run: |
          npm install -g aws-cdk
          pip install --retries 10 --timeout 60 -r requirements.txt
          CDK_SKIP_BUNDLING=1 cdk synth --quiet
          python ../scripts/check_template_cycles.py cdk.out/BsaStack.template.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # id-token lets the runner request the OIDC token the role trusts; without
    # it the assume-role call fails with "Not authorized to perform
    # sts:AssumeRoleWithWebIdentity". contents:read is what checkout needs once
    # the default permissions are narrowed by naming any of them.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::681832767155:role/bsa-github-deploy
          role-session-name: gha-bsa-deploy
          aws-region: ap-south-1

      - name: Deploy
        working-directory: infra
        run: |
          pip install -r requirements.txt
          cdk deploy --require-approval never
