# Categorisation knowledge — the fuzzy, evolving part of the taxonomy, kept as
# DATA so the domain owner can edit it without a code change (the same reasoning
# that made bank layouts a registry). categorize.py loads this; the deterministic
# tier order lives in code, the vocabulary lives here.
#
# Sources: the "Banking extraction data labeling" master (Category list) and the
# review docs ID1–ID8. When the master changes, change this file.

# NBFC / lending-company name fragments. A DEBIT that names one of these is a
# loan servicing payment — an EMI if it recurs, otherwise an "Interest payments"
# (the master: "non-emi payments to NBFCs"). A CREDIT that names one is a loan
# disbursal. Matched case-insensitively, spaces ignored, anywhere in narration.
lenders:
  - Kinara Capital
  - Clix Capital
  - Bajaj Fin
  - Bajaj Finance
  - HDB Financ
  - Tata Capital
  - Aditya Birla Fin
  - Fullerton
  - Cholamandalam
  - Shriram Fin
  - Muthoot
  - Manappuram
  - L&T Finance
  # Piramal: the bare fragment matched PIRAMAL PETROLEUM PVT LTD — a fuel
  # trader whose statements hold hundreds of ordinary transfers, every one of
  # them flipped to EMI/disbursal. Only the lending entities belong here
  # ("ACHD-PIRAMALFINANCELIMI", "ACHD-PIRAMALCAPITALAND", "PIRAMALFINR…").
  - Piramal Fin
  # "Piramal Cap", not "Piramal Capital": Razorpay's collection handle
  # truncates it ("ACHD-…CTRAZORPAY-PIRAMALCAPQF6HK7HS2K2M").
  - Piramal Cap
  - Piramal Housing
  # Vastu Housing Finance, as printed in the NACH pull ("ACHD-BD-VASTUHFC-EMI").
  - VastuHFC
  - Poonawalla
  - Indiabulls
  - LIC Housing
  - PNB Housing
  - Canfin
  - SMFG India Credit
  - SMFGINDIACREDIT
  - Royal Capital
  - Northern Arc
  - Vivriti
  - UGRO
  - Lendingkart
  - Flexiloans
  - Ambit Fin
  # IIFL: the bare fragment matched IIFL CAPITAL / IIFL SECURITIES (a broker —
  # "IIFLCAPITALSERVICE", "IIFLEQ…INDIAINFOLINE.COM"), turning brokerage
  # settlements into loan disbursals. Only the lending entities belong here.
  - IIFL Fin
  - IIFL Home
  - IIFL Samasta
  - Axis Finance
  # As printed (sic) in an IndusInd IMPS row: "N/INDBH…/UTIB/AXIS FINANACE LTD".
  - Axis Finanace
  # Cholamandalam's IMPS beneficiary handle ("CHOLAMXVFPKUD000") — the full name
  # does not appear in the OUT/ transfer form.
  - Cholamx

# Penal charges — a charge levied for a violation or threshold breach. The master
# names "pos threshold, MAB, etc." MAB / minimum-balance / average-balance charges
# belong here.
# Matched as whole words/phrases (word-bounded), so a name like "jambAMBaga"
# or a POS *purchase* ("POS/MD ENTERPRISES") is never mistaken for a penal
# charge. Keep these to actual charge phrases, not bare tokens.
penal_keywords:
  - MAB
  - MIN BAL
  - MIN BALANCE
  - MINIMUM BAL
  - MINIMUM BALANCE
  - AVG BAL
  - AVG BALANCE
  - AVERAGE BAL
  - AMB CHG
  - AMB CHRG
  - NON MAINTENANCE
  - NONMAINTENANCE
  - POS THRESHOLD
  - PENAL
  - OVERDUE
  - LATE FEE
  - LATE PAYMENT

# Service / usage charges that are NOT penal (ID: "card charges and transaction
# charges are not penal charges"). These fall through to Regular debit — the
# master has no dedicated bank-charges category, so they are ordinary debits, not
# penal. Checked BEFORE the penal keywords so a "Dr Card Charges" never counts as
# penal even though it contains "Charges".
non_penal_charge_keywords:
  - CARD CHARGE
  - DR CARD
  - DEBIT CARD
  - TXN CHRG
  - TXN CHARGE
  - TRANSACTION CHARGE
  - BNA
  - ATM CHARGE
  - SMS CHARGE
  - SMS CHRG

# Cash-deposit narration fragments beyond the mode detector's "BY CASH". ICICI
# prints "CASHDEP" glued, which the space-separated "CASH DEP" rule missed, so a
# large cash deposit was read as a regular credit.
cash_deposit_keywords:
  - CASHDEP
  - CASH DEP
  - CDM
  - BY CASH
  - CASH DEPOSIT
  # A CREDIT with "ATM-CASH" is cash deposited at a machine (ID9). A DEBIT with
  # the same text is an ATM withdrawal — handled first, by mode, so this only
  # catches the credit direction.
  - ATM-CASH
  - ATM CASH
  - ATMCASH
  # Axis bunch-note-acceptor deposit stamp ("BNA/DERH554601/3049/040825/
  # LUCKNOW"). The slash keeps it off the "BNA Txn Chrgs" fee phrase, which is
  # a debit anyway (this list is credit-only).
  - BNA/

# Cash withdrawn over the counter rather than at a machine. AU prints a bearer /
# self cheque as "CHQ PAID-SELF-SELF" and a counter payout as "CHQ PAID-TP-CASH
# PAID TO <name>" — both are cash leaving the account, not transfers. Matched on
# DEBITS only, ignoring spaces and punctuation (so "CHQ PAID-SELF" and
# "CHQPAID SELF" are the same key).
cash_withdrawal_keywords:
  - CHQ PAID SELF
  - SELF CHQ PAID
  - CASH PAID
  # Axis counter/kiosk payout ("SAK/CASH WDL/SAK444684919/…/SELF"), spelled-out
  # branch withdrawals ("Cash Withdrawal At Br : KURUD", "CASH WITHDRAWAL
  # BRANCH"), and SBI's encashed cheque ("CHEQUE-CASH 320196 BY CHQ-"). The
  # TDS-on-withdrawal debit is excluded in code — it is tax, not cash.
  - CASH WDL
  - CASH WITHDRAWAL
  - CHEQUE CASH

# A payment that came back — the golden set's biggest gap (0/17 before this
# list existed). Matched on BOTH signs, ignoring spaces and punctuation, so
# "NEFT_RETURN", "CHQDEP RET -" and "CHQ DEP RET-" are the same key. A row that
# also carries a charge token (CHG/CHRG/CHARGE/FEE) is NOT a return — it is the
# bank's fee FOR the return, and stays with the bounce/penal tiers ("CHEQUE
# RETURN CHARGES" is penal; "I/W CHEQUE RETURN-<name>" is the returned amount).
return_keywords:
  - CHQ DEP RET
  - I/W CHEQUE RETURN
  - RETURN IMPS
  - IMPS RETURN
  - RETURN NEFT
  - NEFT RETURN
  - RETURN RTGS
  - RTGS RETURN
  # SBI internet-banking pair: "TO TRANSFER-INB return- <ref>" going out and
  # "BY TRANSFER-INB return- <ref>" coming back — both legs are the return.
  - INB RETURN

# Companies whose NACH credits are dividends on shares the customer holds —
# "ACH-CR-JSW STEEL LIMITED-NACH-…" carries no DIV marker, so the payer name is
# the only signal. Extend as customers' portfolios surface new names; a NACH
# credit not listed here and without a DIV/INT marker stays "ECS transaction".
dividend_payers:
  - JSW Steel
  - Narayana Hrudayalaya

# ---------------------------------------------------------------------------
# Speculative & high-risk SPENDING, from the SME category master's
# "Speculative & High-Risk Spending" block. These do NOT get a category tag of
# their own: the ABCL taxonomy has eighteen tags and each maps to a sheet in
# the customer's template, so inventing a nineteenth would break the output
# contract. A debit here stays "Regular debit" and lands on Regular Debits
# exactly as before — what changes is that the credit assessment now COUNTS it
# and says so, which is the whole reason the master lists them.
#
# Matched case-insensitively with spaces removed, anywhere in the narration, on
# DEBITS only. Keep entries specific: a fragment short enough to appear inside
# an ordinary merchant name will flag a business as a gambler (the "Piramal"
# lesson under `lenders`).
high_risk_spend:
  Gambling / betting / real-money gaming:
    - DREAM11
    - GAMES24X7
    - MY11CIRCLE
    - RUMMYCIRCLE
    - JUNGLEERUMMY
    - ACE2THREE
    - POKERBAAZI
    - 1XBET
    - PARIMATCH
    - STAKE.COM
    - BET365
    - LOTTERY
    - CASINO
  Virtual digital assets / crypto:
    - WAZIRX
    - COINDCX
    - COINSWITCH
    - ZEBPAY
    - UNOCOIN
    - BITBNS
    - BINANCE
    - CRYPTO
  Unlicensed / P2P lending outflows:
