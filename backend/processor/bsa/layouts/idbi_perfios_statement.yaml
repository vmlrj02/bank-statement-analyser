# Layout descriptor: IDBI Bank — Perfios-rendered statement.
#
# IDBI, not IDFC, however the customer filed it: the statement says "IDBI Bank"
# 151 times and "IDFC" not once. It was written as IDFC because the sample sat
# in a folder named for that bank, which is exactly the mistake gotcha 22 warns
# about in the other direction — the folder is the customer's filing, not the
# bank's identity.
# Columns: Srl No | Txn Date | Value Date | Description | Cheque CC |
# CR/DR | Amount (INR) | Balance (INR).
#
# NOT the same shape as au_perfios_statement despite the same renderer: AU's
# export has separate Debit and Credit columns, this one has a SINGLE amount
# column whose sign comes from a Dr./Cr. flag in its own band — the same
# arrangement as the Axis cash-credit report.
#
# Two wrinkles the export itself introduces. The txn date is followed by a
# TIME in the same column, so date_parts stays 1 and the time falls into the
# gap before the description. And Perfios does not render every row's date the
# same way — most are 21/04/2026, a few come out ISO as 2026-04-21 — so the
# anchor accepts both and normalize parses whichever arrives.
id: idbi_perfios_statement
bank: IDBI Bank
layout_name: Statement (Perfios)
version: 1
parser: generic
priority: 12
fingerprints:
  all_of:
    - "Amount (INR)"
    - "Balance (INR)"
  any_of:
    - "Primary Account Holder Name"
    - "YOUR A/C STATUS"
header:
  # The last page prints "Dr Count | Cr Count | Debits | Credits", which lets
  # completeness.py prove no row was dropped rather than inferring it from a
  # balance chain that would reconcile even if a whole day went missing.
  summary_totals: 'Dr Count\s+Cr Count\s+Debits\s+Credits\s+\d+\s+\d+\s+(?P<sum_debits>\d+)\s+(?P<sum_credits>\d+)'
  account_line: 'Transaction Date From\s*:\s*(?P<period_from>\d{2}/\d{2}/\d{4}) to:\s*(?P<period_to>\d{2}/\d{2}/\d{4})\s*A/C NO:\s*(?P<account_no>\d+)'
  period_date_format: "%d/%m/%Y"
parse:
  table_header_words: ["Amount", "Balance"]
  header_offset: 14
  row_anchor: '^(\d{2}/\d{2}/\d{4}|\d{4}-\d{2}-\d{2})$'
  date_format: "%d/%m/%Y"
  continuation: below
  columns:
    sl_no_x_max: 65             # drop the Srl No column (51-59)
    date_x_max: 104             # Txn Date 68-103; the TIME follows at 105
    cheque_x_min: 99999
    cheque_x_max: 99999
    remarks_x_min: 205          # Description from 210
    remarks_x_max: 445          # stops before the Dr./Cr. flag at 454
    type_band: [450, 472]       # the Dr./Cr. flag sits in a column of its own
    amount_x1_max: 570          # Amount (INR)  — right edge 555
    balance_x1_max: 645         # Balance (INR) — right edge 625
    tail_x_min: 99999
    # read from the COLUMN config, not from parse:
    debit_flags: ["Dr.", "DR.", "DR", "Dr", "D"]
  footer_markers:
    - "This is a computer generated"
    - "system generated"
    - "Page"
    # The final page carries a Statement Summary table and a long disclaimer
    # BELOW the transactions, and this export runs newest-first — so the whole
    # block was appended to the OLDEST transaction, which is row 1 of the sheet
    # a reader opens. The reviewer found it that way, with the PDF beside the
    # CSV.
    #
    # Markers are tested against what lands in the NARRATION column, not the
    # whole page. The summary is a bordered table, so "Dr Count" and "Cr Count"
    # sit to the LEFT of the description band and never reach the line being
    # matched — only "Debits Credits" and the sentence beneath it do. Listing
    # the left-hand cells too costs nothing and documents the shape.
    - "Statement Summary"
    - "Dr Count"
    - "Debits Credits"
    - "does not require signature"
    - "Important Information"
    - "Contents of this statement"
    - "reported in writing immediately"
    - "DO NOT reply"
    - "Service Tax Registration"
    - "Regd. Office"
