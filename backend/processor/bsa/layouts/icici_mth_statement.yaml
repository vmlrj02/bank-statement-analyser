# Layout descriptor: ICICI Bank — monthly "Statement_YYYYMTHnn" export. Opens
# with a cover STATEMENT SUMMARY on page 1 and prints the transaction table from
# page 2 under: DATE | MODE | PARTICULARS | DEPOSITS | WITHDRAWALS | BALANCE.
# Deposits sit to the LEFT of withdrawals, so the money columns are named
# explicitly via amount_bands. The account line is on the transaction page, not
# the cover, which _meta now reaches. Distinct from icici_combined_statement
# ("Statement of transactions in ... in Currency", with a Location column).
id: icici_mth_statement
bank: ICICI Bank
layout_name: Monthly Statement
version: 1
parser: generic
priority: 12
fingerprints:
  all_of:
    - "STATEMENT SUMMARY"
    - "Base Branch"
  any_of: []
header:
  # one rendering writes "…Account 0364 in INR…", the other
  # "…Account Number: 777701537799 in INR…" — the label is optional
  account_line: 'Statement of Transactions in .*?Account\s+(?:Number:\s*)?(?P<account_no>[X\d]+)\s+in INR for the period\s+(?P<period_from>[A-Za-z]+ \d{2}, \d{4})\s*-\s*(?P<period_to>[A-Za-z]+ \d{2}, \d{4})'
  period_date_format: "%B %d, %Y"
  account_name_line: 1
parse:
  # "MODE" is deliberately NOT required: one rendering prints it as "MODE**"
  # (with a footnote marker), and an exact-token match then never finds the
  # table header at all — the file parsed to zero rows with no error. The other
  # five words locate the header unambiguously on their own.
  table_header_words: ["DATE", "PARTICULARS", "DEPOSITS", "WITHDRAWALS", "BALANCE"]
  header_offset: 12
  row_anchor: '^\d{2}-\d{2}-\d{4}$'
  date_format: "%d-%m-%Y"
  continuation: below
  columns:
    date_x_max: 72              # DATE ~30-68
    remarks_x_min: 72           # MODE (~73) + PARTICULARS (~140)
    remarks_x_max: 345          # before DEPOSITS (~355)
    cheque_x_min: 99999
    cheque_x_max: 99999
    # Two renderings of this same export sit in the sample set and their
    # columns are shifted ~18pt apart (right edges 406/489/564 in one, 427/505/583
    # in the other). The bands are widened to hold both rather than split into
    # two near-identical descriptors; they stay disjoint, so a value still lands
    # in exactly one role.
    amount_bands:
      deposit:    [345, 435]    # DEPOSITS    right edge ~406 or ~427
      withdrawal: [440, 515]    # WITHDRAWALS right edge ~489 or ~505
      balance:    [520, 595]    # BALANCE     right edge ~564 or ~583
    tail_x_min: 99999
  skip_rows:
    - "B/F"
    - "Total of Transactions"
    - "Total :"
    - "Total:"
  footer_markers:
    - "This is a system generated"
    - "Page "
