# Layout descriptor: Axis Bank — "Statement of Account" export (the LIBERTY
# savings statement), a different shape from axis_account_statement: a single
# line per row with Debit / Credit / Balance columns and a trailing Init.Br
# code. Its header says "Statement of Account No" (no "Axis"), which is what
# keeps it from colliding with the other Axis fingerprint.
id: axis_statement_of_account
bank: Axis Bank
layout_name: Statement of Account
version: 1
parser: generic
fingerprints:
  all_of:
    - "Statement of Account No"
    - "UTIB0"
  any_of: []
header:
  account_line: 'Statement of Account No\s*:\s*(?P<account_no>\d+)\s*for the period\s*\(From\s*:\s*(?P<period_from>[\d-]+)\s*To\s*:\s*(?P<period_to>[\d-]+)\)'
  period_date_format: "%d-%m-%Y"
  # Axis prints "TRANSACTION TOTAL <debits> <credits>" — the amount totals
  # let us prove no row was dropped (completeness.py).
  summary_totals: 'TRANSACTION TOTAL\s+(?P<sum_debits>[\d,]+\.\d{2})\s+(?P<sum_credits>[\d,]+\.\d{2})'
  account_name_line: 0
parse:
  table_header_words: ["Particulars", "Debit", "Credit", "Balance"]
  header_offset: 16
  row_anchor: '^\d{2}-\d{2}-\d{4}$'
  date_format: "%d-%m-%Y"
  # ABOVE, not below. Axis bottom-aligns the date in its cell, so a wrapped
  # narration's FIRST line is printed above the dated line and only its last
  # line sits beside the date. Read as "below", every wrap was attached to the
  # PREVIOUS row and the whole description column shifted by one — row 572 read
  # "Paymen/CANARA BANK UPI/P2A/776389830343/RAVI SHAN/FEDERAL", the tail of one
  # payment glued to the head of the next.
  #
  # Nothing downstream could see it: the amounts and the balance are on the
  # dated line, so every row reconciled and validate() passed with zero issues
  # on 1,240 rows. The reviewer found it by reading the PDF beside the CSV and
  # asking why a bordered table was being parsed wrongly.
  continuation: above
  skip_rows:
    - "OPENING BALANCE"
    - "CLOSING BALANCE"
    - "TRANSACTION TOTAL"
  columns:
    date_x_max: 90
    cheque_x_min: 91           # Chq No column
    cheque_x_max: 130
    remarks_x_min: 131
    remarks_x_max: 335         # before the Debit column
    withdrawal_x1_max: 385     # Debit, right edge 379
    deposit_x1_max: 460        # Credit, right edge 442
    balance_x1_max: 535        # Balance, right edge 531
    tail_x_min: 536            # Init.Br branch code column
  footer_markers:
    - "End of Statement"
    # The closing legal legend / DICGC block prints below the last transaction
    # with no date, so continuation appended it to the final row (a 1,370-char
    # narration). Break at its first line instead.
    - "notifies the bank"
    - "Deposit Insurance and Credit"
    - "system generated output"
    - "Legends :"
